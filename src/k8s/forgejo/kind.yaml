kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: forgejo-demo
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # Git por SSH. No uses 22: choca con sshd del host.
      - containerPort: 2222
        hostPort: 2222
        protocol: TCP
